server:
  port: 8080

spring:
  application:
    name: drivenow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/drivenow}
    username: ${DB_USER:drivenow}
    password: ${DB_PASSWORD:drivenow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

odoo:
  url: ${ODOO_URL:http://localhost:8069}
  database: ${ODOO_DB:drivenow}
  api-key: ${ODOO_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
