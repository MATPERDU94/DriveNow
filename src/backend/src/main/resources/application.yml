server:
  port: 8080

spring:
  application:
    name: drivenow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/drivenow}
    username: ${DB_USER:drivenow}
    password: ${DB_PASSWORD:drivenow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

odoo:
  url: ${ODOO_URL:http://localhost:8069}
  database: ${ODOO_DB:drivenow}
  api-key: ${ODOO_API_KEY:}

moloni:
  client-id: ${MOLONI_CLIENT_ID:}
  client-secret: ${MOLONI_CLIENT_SECRET:}
  username: ${MOLONI_USERNAME:}
  password: ${MOLONI_PASSWORD:}
  # id da empresa no Moloni (a conta pode ter também a "Empresa Demonstração")
  company-id: ${MOLONI_COMPANY_ID:}
  # false = faturas em rascunho (sem valor fiscal, sem PDF); true = faturas finalizadas, com PDF
  fechar-documentos: ${MOLONI_FECHAR_DOCUMENTOS:false}
  # IVA incluído nos preços do tarifário (%)
  iva: ${MOLONI_IVA:23}

drivenow:
  # Limite das penalizações por viagem (€)
  franquia: ${DRIVENOW_FRANQUIA:1000}
  # Segredo para assinar os tokens de login (mínimo 32 caracteres; mudar em produção)
  jwt-secret: ${JWT_SECRET:drivenow-segredo-de-desenvolvimento-mudar-em-producao}
  # Validade do token de login (horas)
  jwt-horas: ${JWT_HORAS:24}
  # Endereços do frontend autorizados a chamar a API (CORS)
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
