services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drivenow
      POSTGRES_USER: drivenow
      POSTGRES_PASSWORD: drivenow
    ports:
      - "5433:5432"
    volumes:
      - backend-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivenow -d drivenow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/drivenow
      DB_USER: drivenow
      DB_PASSWORD: drivenow
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend-db:
